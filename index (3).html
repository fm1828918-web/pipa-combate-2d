function freshSave(){return {version:1,name:'Piloto',level:1,xp:0,coins:120,wins:0,losses:0,ownedPipes:['classica'],equippedPipe:'classica',custom:{primary:'#ff594f',secondary:'#ffd166',pattern:'dividida',tail:'fitas',effect:'none'},inventory:[],upgrades:{ctl:0,def:0},careerCompleted:[],tournamentsWon:[],activeTournament:null,achievements:[],stats:{battles:0,wins:0,perfect:0,coinsEarned:0,bestStreak:0},streak:0,missions:{date:today(),progress:{},claimed:[]},settings:{music:35,sfx:65,quality:'alta',particles:true,vibration:false,tips:true,muted:false},tutorialSeen:false};}
function loadSave(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return freshSave();const d=JSON.parse(raw),base=freshSave();return {...base,...d,stats:{...base.stats,...d.stats},settings:{...base.settings,...d.settings},custom:{...base.custom,...d.custom},missions:d.missions||base.missions,upgrades:d.upgrades||base.upgrades};}catch(e){console.warn('Save inválido, iniciando novo jogo.',e);return freshSave();}}
let save=loadSave();
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));updateTop();}catch(e){toast('Não foi possível salvar neste navegador.');console.warn(e);}}
function updateTop(){$('#topLevel').textContent=save.level;$('#topCoins').textContent=save.coins;}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2300);}
function gainXP(n){save.xp+=n;let leveled=false;while(save.xp>=save.level*100){save.xp-=save.level*100;save.level++;leveled=true;}if(leveled)toast('Nível '+save.level+' desbloqueado!');}
function addCoins(n){save.coins+=n;save.stats.coinsEarned+=n;}
function owned(id){return save.ownedPipes.includes(id);}
function pipeById(id){return pipes.find(p=>p.id===id)||pipes[0];}
function getPipeStats(id){const p=pipeById(id);return {...p.stats,ctl:p.stats.ctl+(id===save.equippedPipe?save.upgrades.ctl:0),def:p.stats.def+(id===save.equippedPipe?save.upgrades.def:0)};}
function ensureMissions(){if(save.missions.date!==today()){save.missions={date:today(),progress:{},claimed:[]};saveGame();}}
function missionProgress(key){return save.missions.progress[key]||0;}
function addMission(key,n=1){ensureMissions();save.missions.progress[key]=missionProgress(key)+n;saveGame();}
function checkAchievements(){let changed=[];for(const [id,name,desc,ico,fn] of achievementDefs){if(!save.achievements.includes(id)&&fn(save)){save.achievements.push(id);changed.push(name);}}if(changed.length){saveGame();toast('Conquista: '+changed.join(', '));}}
function renderScreen(screen){currentScreen=screen;$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));const c=$('#content');if(screen==='home')c.innerHTML=homeView();else if(screen==='career')c.innerHTML=careerView();else if(screen==='quick')c.innerHTML=quickView();else if(screen==='tournaments')c.innerHTML=tournamentsView();else if(screen==='garage')c.innerHTML=garageView();else if(screen==='shop')c.innerHTML=shopView();else if(screen==='missions')c.innerHTML=missionsView();else if(screen==='achievements')c.innerHTML=achievementsView();else if(screen==='settings')c.innerHTML=settingsView();else if(screen==='credits')c.innerHTML=creditsView();else c.innerHTML=homeView();updateTop();if(screen==='garage')drawPreview();}

function audioReady(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});}

function startMusic(){audioReady();if(musicTimer||!audioCtx)return;musicTimer=setInterval(()=>{if(save.settings.muted||save.settings.music===0||!audioCtx)return;const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];const f=notes[musicStep++%notes.length];const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;const v=(save.settings.music/100)*.025;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.32);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.34);},420);}

 b.playerPulseTimer=Math.max(0,b.playerPulseTimer-dt);if(save.settings.particles&&save.settings.quality!=='baixa'&&Math.random()<.24)spawnParticles(p.x*960,p.y*540,'#e8faff',1);

function activatePulse(){if(!battle||battle.paused||battle.ended)return;audioReady();if(battle.skillCooldown>0||battle.player.energy<28){toast('Energia ou recarga insuficiente.');return;}const b=battle;const perfect=b.timing>.66&&b.timing<.84;const distance=Math.hypot((b.player.x-b.enemy.x)*960,(b.player.y-b.enemy.y)*540);b.skillCooldown=2.5;b.skillActive=.75;b.player.energy-=28;b.pulses++;b.message=perfect?'MANOBRA PERFEITA!':'Pulso energético ativado';b.messageTimer=1.1;if(perfect){b.perfect++;b.player.energy=clamp(b.player.energy+9,0,100);sfx('perfect');}else sfx('pulse');if(distance>430){b.message='Pulso lançado! Aproxime-se do rival.';}if(navigator.vibrate&&save.settings.vibration&&perfect)navigator.vibrate(25);updateHud();}
function spawnParticles(x,y,color,n){const max=save.settings.quality==='baixa'?35:save.settings.quality==='media'?65:120;for(let i=0;i<n&&battle.particles.length<max;i++){battle.particles.push({x,y,vx:rand(-100,100),vy:rand(-90,90),life:rand(.25,.7),max:.7,color,size:rand(2,5)});}}
function drawBattle(){const b=battle;if(!b||!b.ctx)return;const c=b.canvas,ctx=b.ctx;const w=960,h=540;const arena=b.arena;const grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,arena.sky[0]);grad.addColorStop(1,arena.sky[1]);ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
 // sol, clima e nuvens em movimento
 if(b.weather==='Pôr do sol'){const sunset=ctx.createLinearGradient(0,250,0,540);sunset.addColorStop(0,'#ffb36b00');sunset.addColorStop(1,'#ff985055');ctx.fillStyle=sunset;ctx.fillRect(0,0,w,h);}
 if(b.weather==='Nublado'){ctx.fillStyle='#63758b22';ctx.fillRect(0,0,w,280);}
 ctx.fillStyle=arena.id==='neon'?'#f3aaff':'#fff2ad';ctx.beginPath();ctx.arc(820,85,arena.id==='neon'?35:42,0,Math.PI*2);ctx.fill();for(let i=0;i<5;i++){const x=((i*235-b.elapsed*12)%1100+1100)%1100-70,y=75+(i%3)*52;drawCloud(ctx,x,y,1+(i%2)*.25);}
 if(b.weather==='Chuva leve'){ctx.strokeStyle='#d9f5ff99';ctx.lineWidth=1.5;for(let i=0;i<45;i++){const x=(i*97+b.elapsed*115)%w,y=(i*61+b.elapsed*235)%390;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-7,y+15);ctx.stroke();}}
 if(arena.id==='praia'){ctx.fillStyle='#5eb9d8';ctx.fillRect(0,385,w,80);ctx.fillStyle='#e6d29b';ctx.fillRect(0,445,w,95);}
 if(arena.id==='neon'){for(let i=0;i<12;i++){const x=i*88+6,bh=110+(i*37)%160;ctx.fillStyle=i%2?'#272d62':'#33275e';ctx.fillRect(x,340-bh,65,bh);for(let yy=355-bh;yy<330;yy+=22)for(let xx=x+10;xx<x+59;xx+=18){ctx.fillStyle='#58e1dc';ctx.globalAlpha=.5;ctx.fillRect(xx,yy,7,9);ctx.globalAlpha=1;}}}else{for(let i=0;i<11;i++){const x=i*95-10,bh=65+(i*41)%120;ctx.fillStyle=['#637e9b','#7795a6','#6b8799'][i%3];ctx.fillRect(x,390-bh,82,bh);ctx.fillStyle='#f6dfa3';for(let yy=402-bh;yy<380;yy+=25)for(let xx=x+12;xx<x+75;xx+=22)ctx.fillRect(xx,yy,8,10);}if(arena.id!=='praia'){ctx.fillStyle=arena.ground;ctx.fillRect(0,470,w,70);for(let i=0;i<14;i++){const x=i*80+20;ctx.fillStyle='#426a57';ctx.beginPath();ctx.arc(x,462,24,Math.PI,Math.PI*2);ctx.fill();}}}
 // atmospheric wind streamers
 ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;for(let i=0;i<5;i++){const y=155+i*57;ctx.beginPath();ctx.moveTo(20,y);ctx.bezierCurveTo(160,y-15+Math.sin(b.elapsed+i)*8,240,y+15,350,y);ctx.stroke();}
 drawKite(ctx,b.player.x*w,b.player.y*h,save.custom.primary,save.custom.secondary,save.custom.pattern,1,b.skillActive>0);drawLine(ctx,b.player.x*w,b.player.y*h,78,486,'#ffffffaa');drawKite(ctx,b.enemy.x*w,b.enemy.y*h,'#ff7587','#ffd166','raio',.86,b.enemyPulseFlash>0);drawLine(ctx,b.enemy.x*w,b.enemy.y*h,875,482,'#ffe2e2aa');
 b.particles=b.particles.filter(p=>{p.life-=1/60;p.x+=p.vx/60;p.y+=p.vy/60;p.vx*=.98;p.vy*=.98;if(p.life<=0)return false;ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;return true;});if(b.skillActive>0){ctx.strokeStyle='#7cf7ff';ctx.lineWidth=3;ctx.globalAlpha=.3+b.skillActive*.5;ctx.beginPath();ctx.arc(b.player.x*w,b.player.y*h,45+(1-b.skillActive)*55,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
}
function drawCloud(ctx,x,y,s){ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.arc(x,y,17*s,0,Math.PI*2);ctx.arc(x+20*s,y-9*s,22*s,0,Math.PI*2);ctx.arc(x+45*s,y,18*s,0,Math.PI*2);ctx.fill();}
function drawKite(ctx,x,y,c1,c2,pattern,scale=1,glow=false){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(performance.now()/650+x)*.09);ctx.scale(scale,scale);if(glow){ctx.shadowColor='#7cf7ff';ctx.shadowBlur=24;}ctx.beginPath();ctx.moveTo(0,-36);ctx.lineTo(32,0);ctx.lineTo(0,38);ctx.lineTo(-32,0);ctx.closePath();ctx.fillStyle=c1;ctx.fill();ctx.strokeStyle='#f6fbff';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(0,-36);ctx.lineTo(0,38);ctx.lineTo(-32,0);ctx.closePath();ctx.fillStyle=c2;ctx.globalAlpha=.72;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#ffffff';ctx.lineWidth=2.3;ctx.beginPath();if(pattern==='estrela'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?8:19;const px=Math.cos(a)*r,py=Math.sin(a)*r;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();}else if(pattern==='raio'){ctx.moveTo(7,-17);ctx.lineTo(-5,3);ctx.lineTo(5,2);ctx.lineTo(-4,21);ctx.lineTo(13,-3);ctx.lineTo(3,-2);}else{ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.moveTo(0,-30);ctx.lineTo(0,31);}ctx.stroke();ctx.restore();}
function drawLine(ctx,x,y,ex,ey,color){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo((x+ex)/2+Math.sin(performance.now()/300)*10,(y+ey)/2,ex,ey);ctx.stroke();ctx.restore();}
function updateHud(){if(!battle)return;const b=battle,p=b.player,e=b.enemy;const set=(id,v)=>{const el=$(id);if(el)el.textContent=v;};const bar=(id,v)=>{const el=$(id);if(el)el.style.width=clamp(v,0,100)+'%';};set('#playerResText',Math.ceil(p.res/p.maxRes*100)+'%');set('#enemyResText',Math.ceil(e.res/e.maxRes*100)+'%');set('#energyText',Math.ceil(p.energy)+'%');bar('#playerResBar',p.res/p.maxRes*100);bar('#enemyResBar',e.res/e.maxRes*100);bar('#energyBar',p.energy);bar('#enemyEnergyBar',e.energy);set('#speedText',p.speed);set('#perfectText',b.perfect);set('#pulseText',b.pulses);set('#windShort',Math.abs(b.wind).toFixed(1));set('#windText','🌬️ '+b.weather+' • '+(b.windDir*b.wind>0?'→':'←')+' '+Math.round(Math.abs(b.wind)*10));set('#battleMessage',b.messageTimer>0?b.message:'');set('#timerText',String(Math.floor(b.elapsed/60)).padStart(2,'0')+':'+String(Math.floor(b.elapsed%60)).padStart(2,'0'));bar('#timingBar',b.timing*100);const tb=$('#timingBar');if(tb){tb.style.background=b.timing>.66&&b.timing<.84?'#5de2ed':'linear-gradient(90deg,#5de2ed,#548cff)';}}
function endBattle(win){if(!battle||battle.ended)return;battle.ended=true;cancelAnimationFrame(battleRAF);const b=battle,cfg=b.config;save.stats.battles++;addMission('battles');save.stats.perfect+=b.perfect;addMission('perfect',b.perfect);if(win){save.wins++;save.stats.wins++;save.streak++;save.stats.bestStreak=Math.max(save.stats.bestStreak,save.streak);addMission('wins');const reward=cfg.reward||65;const xp=cfg.xp||45;addCoins(reward);gainXP(xp);if(cfg.type==='career'&&!save.careerCompleted.includes(cfg.phase)){save.careerCompleted.push(cfg.phase);addCoins(phases[cfg.phase-1].reward);gainXP(25);}if(cfg.type==='tournament'){save.activeTournament.round++;if(save.activeTournament.round>save.activeTournament.rounds){save.tournamentsWon.push(save.activeTournament.id);addCoins(cfg.tournamentPrize||300);save.activeTournament=null;}}sfx('win');}else{save.losses++;save.streak=0;sfx('lose');}
 checkAchievements();saveGame();const c=$('#content');const next=cfg.type==='career'&&win&&cfg.phase<20?cfg.phase+1:null;let extra='';let primaryAction='replay-battle',primaryLabel='Jogar novamente';if(win&&cfg.type==='career'&&next){primaryAction='next-phase';primaryLabel='Próxima fase';}else if(win&&cfg.type==='career'&&cfg.phase===20){primaryAction='result-menu';primaryLabel='Concluir campanha';}else if(win&&cfg.type==='tournament'&&save.activeTournament){primaryAction='continue-tournament';primaryLabel='Próxima rodada';}else if(win&&cfg.type==='tournament'&&!save.activeTournament){primaryAction='result-tournaments';primaryLabel='Ver torneios';}if(cfg.type==='tournament'&&win){const t=tournaments.find(x=>x.id===cfg.tournamentId);if(save.activeTournament){extra=`<div class="notice">Rodada ${save.activeTournament.round-1} de ${save.activeTournament.rounds} vencida. Próxima rodada liberada!</div>`;}else if(t&&save.tournamentsWon.includes(t.id)){extra='<div class="notice">🏆 Você venceu o torneio e entrou para o hall dos campeões!</div>';}}
 c.innerHTML=`<div class="panel" style="text-align:center;padding:clamp(20px,5vw,48px)"><div style="font-size:64px;margin-bottom:5px">${win?'🏆':'🌤️'}</div><div class="eyebrow" style="justify-content:center">${win?'DUELO CONCLUÍDO':'FIM DE PARTIDA'}</div><h2 style="font-size:clamp(30px,5vw,44px);margin:9px 0">${win?'VITÓRIA!':'QUASE LÁ!'}</h2><p class="muted">${win?'Mandou bem, '+escapeHTML(save.name)+'! Seu nome está subindo no céu.':'O rival levou essa. Ajuste sua estratégia e tente novamente.'}</p><div class="result-stats"><div><b>${win?'+'+(cfg.reward||65):'0'}</b><small>Moedas base</small></div><div><b>${b.perfect}</b><small>Manobras perfeitas</small></div><div><b>${Math.floor(b.elapsed)}s</b><small>Tempo de voo</small></div></div>${extra}<div class="notice" style="margin:10px auto;max-width:520px">${win?'Recompensas adicionadas ao seu perfil.':'Nenhuma moeda foi perdida. Sua evolução continua salva.'}</div><div class="modal-actions" style="justify-content:center"><button class="primary" data-action="${primaryAction}">${primaryLabel}</button><button class="secondary" data-action="result-menu">Menu principal</button></div></div>`;battle=null;renderTopAfterResult();}
function renderTopAfterResult(){updateTop();}
function pauseBattle(){if(!battle||battle.ended)return;battle.paused=true;showModal('PAUSADO','A partida está parada. Respire e prepare seu próximo movimento.',`<button class="primary" data-action="resume">Continuar</button><button class="secondary" data-action="restart">Reiniciar partida</button><button class="ghost" data-action="pause-settings">Configurações</button><button class="danger" data-action="quit-battle">Voltar ao menu</button>`);}
function showModal(title,body,actions,extra=''){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" data-action="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2><p>${body}</p>${extra}<div class="modal-actions">${actions}</div></div></div>`;currentModal=true;}
function closeModal(){ $('#modalRoot').innerHTML='';currentModal=null;}
function startCareer(){if(!save.name||save.name==='Piloto'){showModal('Como quer ser chamado?','Escolha o nome que aparecerá nas partidas.',`<button class="primary" data-action="save-name">Começar minha jornada</button>`,`<div class="field"><label>NOME DO PILOTO</label><input id="pilotName" maxlength="18" placeholder="Ex.: Ventania" value="${escapeHTML(save.name==='Piloto'?'':save.name)}"></div>`);return;}if(!save.tutorialSeen){showModal('Bem-vindo aos céus!','Mova a pipa com WASD ou as setas. Segure Shift para acelerar. O pulso de energia disputa a resistência virtual do rival. Acerte a faixa azul no medidor para uma manobra perfeita.',`<button class="primary" data-action="begin-tutorial">Entendi, vamos voar!</button>`);return;}renderScreen('career');}
function startPhase(id){const p=phases.find(x=>x.id===Number(id));if(!p)return;if(p.id>1&&!save.careerCompleted.includes(p.id-1)){toast('Conclua a fase anterior primeiro.');return;}beginBattle({type:'career',phase:p.id,arena:p.arena,ai:p.ai,reward:65+p.id*3,xp:40+p.id*3,enemyName:enemyName(p.ai,p.id)});}
function startQuick(){const arena=$('#quickArena')?.value||'bairro',ai=$('#quickAI')?.value||'INICIANTE';beginBattle({type:'quick',arena,ai,reward:65,xp:45});}
function startTournament(id){const t=tournaments.find(x=>x.id===id);if(!t)return;if(save.level<t.level){toast('Você ainda não tem nível suficiente.');return;}if(save.activeTournament&&save.activeTournament.id!==id){toast('Finalize ou abandone o torneio atual primeiro.');return;}if(!save.activeTournament){save.activeTournament={id,round:1,rounds:t.rounds};saveGame();}launchTournamentRound();}
function launchTournamentRound(){const active=save.activeTournament;if(!active)return;const t=tournaments.find(x=>x.id===active.id);const ais=['VELOZ','DEFENSIVO','ESTRATEGISTA','AGRESSIVO','LENDÁRIO'];const ai=ais[Math.min(ais.length-1,Math.floor((active.round-1)/Math.max(1,t.rounds-1)*4))];beginBattle({type:'tournament',tournamentId:t.id,tournamentName:t.name,round:active.round,arena:t.arena,ai,reward:80+active.round*20,xp:55,tournamentPrize:t.price+250,enemyName:enemyName(ai,active.round)});}
function handleBuyPipe(id){const p=pipeById(id);if(owned(id))return;if(save.level<p.unlock+1){toast('Desbloqueia no nível '+(p.unlock+1)+'.');return;}if(save.coins<p.price){toast('Moedas insuficientes.');return;}save.coins-=p.price;save.ownedPipes.push(id);save.equippedPipe=id;selectedPipe=id;sfx('unlock');saveGame();toast(p.name+' desbloqueada!');renderScreen('garage');}
function handleBuyItem(id){const pipeItem=pipes.find(p=>p.id===id&&p.price>0);if(pipeItem){handleBuyPipe(id);return;}const x=shopItems.find(i=>i.id===id);if(!x||save.inventory.includes(id))return;if(save.coins<x.price){toast('Moedas insuficientes.');return;}save.coins-=x.price;save.inventory.push(id);if(x.type==='upgrade')save.upgrades[x.value]=(save.upgrades[x.value]||0)+3;else if(x.type==='pattern')save.custom.pattern=x.value;else if(x.type==='tail')save.custom.tail=x.value;else if(x.type==='effect')save.custom.effect=x.value;else if(x.type==='colorPrimary')save.custom.primary=x.value;else if(x.type==='colorSecondary')save.custom.secondary=x.value;sfx('buy');saveGame();toast(x.name+' adquirido!');renderScreen('shop');}
function handleClaimMission(id){const m=missionTemplates.find(x=>x.id===id);if(!m||save.missions.claimed.includes(id)||missionProgress(m.key)<m.goal)return;save.missions.claimed.push(id);addCoins(m.reward);saveGame();sfx('unlock');toast('Recompensa de '+m.reward+' moedas resgatada!');renderScreen('missions');}
function handleAction(action,el){const id=el?.dataset.id;switch(action){case 'open-settings':if(battle)battle.paused=true;renderScreen('settings');break;case 'start-career':startCareer();break;case 'begin-tutorial':save.tutorialSeen=true;saveGame();closeModal();startPhase(1);break;case 'save-name':{const n=($('#pilotName')?.value||'Piloto').trim().slice(0,18);save.name=n||'Piloto';saveGame();closeModal();showModal('Tutorial rápido','Use WASD ou as setas para controlar a pipa. Acelere com Shift e acerte a faixa azul com Espaço para executar manobras perfeitas.',`<button class="primary" data-action="begin-tutorial">Bora!</button>`);break;}case 'start-phase':startPhase(id);break;case 'start-quick':startQuick();break;case 'join-tournament':startTournament(id);break;case 'continue-tournament':launchTournamentRound();break;case 'select-pipe':selectedPipe=id;renderScreen('garage');break;case 'equip-pipe':if(owned(id)){save.equippedPipe=id;selectedPipe=id;saveGame();renderScreen('garage');toast('Pipa equipada!');}break;case 'buy-pipe':handleBuyPipe(id);break;case 'buy-item':handleBuyItem(id);break;case 'shop-cat':shopCategory=id;renderScreen('shop');break;case 'claim-mission':handleClaimMission(id);break;case 'claim-streak':if(save.streak>=3&&!save.inventory.includes('streak-reward')){addCoins(150);save.inventory.push('streak-reward');saveGame();toast('Bônus de sequência resgatado!');renderScreen('missions');}break;case 'reset-custom':{const p=pipeById(save.equippedPipe);save.custom={...save.custom,primary:p.colors[0],secondary:p.colors[1],pattern:p.pattern,tail:p.tail,effect:'none'};saveGame();renderScreen('garage');toast('Aparência restaurada.');break;}case 'battle-pulse':activatePulse();break;case 'battle-boost':touchKeys.boost=true;setTimeout(()=>touchKeys.boost=false,350);break;case 'pause':pauseBattle();break;case 'resume':closeModal();if(battle){battle.paused=false;if(currentScreen==='settings')renderBattle();lastFrame=performance.now();}break;case 'restart':{const cfg={...battle.config};closeModal();beginBattle(cfg);break;}case 'quit-battle':closeModal();cancelAnimationFrame(battleRAF);battle=null;renderScreen('home');break;case 'pause-settings':closeModal();if(battle)battle.paused=true;renderScreen('settings');break;case 'return-battle':if(battle){battle.paused=false;renderBattle();lastFrame=performance.now();}break;case 'fullscreen':if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>toast('Tela cheia indisponível.'));else document.exitFullscreen?.();break;case 'reset-save':showModal('Apagar progresso?','Isso remove moedas, pipas, fases e conquistas salvas neste navegador. Esta ação não pode ser desfeita.',`<button class="danger" data-action="confirm-reset">Sim, apagar tudo</button><button class="secondary" data-action="close-modal">Cancelar</button>`);break;case 'confirm-reset':localStorage.removeItem(SAVE_KEY);save=freshSave();selectedPipe='classica';closeModal();saveGame();renderScreen('home');toast('Progresso reiniciado.');break;case 'close-modal':closeModal();break;case 'next-phase':{const cfg=lastBattleConfig;if(cfg?.type==='career')startPhase(cfg.phase+1);else if(save.activeTournament)launchTournamentRound();else renderScreen('career');break;}case 'result-tournaments':renderScreen('tournaments');break;case 'replay-battle':{const cfg=lastBattleConfig;if(cfg)beginBattle({...cfg});else renderScreen('quick');break;}case 'result-menu':renderScreen('home');break;case 'modal-backdrop':if(el===el.currentTarget)closeModal();break;}}
let lastBattleConfig=null;
const originalBeginBattle=beginBattle;beginBattle=function(cfg){lastBattleConfig={...cfg};originalBeginBattle(cfg);};
// UI events: delegação deixa os botões de telas dinâmicas funcionais.
document.addEventListener('click',e=>{const nav=e.target.closest('[data-screen]');if(nav){sfx('click');renderScreen(nav.dataset.screen);return;}const btn=e.target.closest('[data-action]');if(btn){if(btn.dataset.action==='modal-backdrop'&&e.target!==btn)return;sfx(['battle-pulse','pause','resume','start-phase','start-quick'].includes(btn.dataset.action)?'click':'click');handleAction(btn.dataset.action,btn);}});
document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-touch]');if(t){touchKeys[t.dataset.touch]=true;t.setPointerCapture?.(e.pointerId);}});document.addEventListener('pointerup',e=>{const t=e.target.closest('[data-touch]');if(t)touchKeys[t.dataset.touch]=false;});document.addEventListener('pointercancel',()=>{touchKeys={};});
document.addEventListener('input',e=>{if(e.target.id==='customPrimary'||e.target.id==='customSecondary'){if(currentScreen!=='garage')return;save.custom[e.target.id==='customPrimary'?'primary':'secondary']=e.target.value;saveGame();drawPreview();}if(e.target.id==='musicVol'||e.target.id==='sfxVol'){save.settings[e.target.id==='musicVol'?'music':'sfx']=Number(e.target.value);const lab=e.target.id==='musicVol'?'musicValue':'sfxValue';$('#'+lab).textContent=e.target.value+'%';saveGame();} });

window.addEventListener('keydown',e=>{const key=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[key]=true;if(key===' '&&!e.repeat)activatePulse();if(key==='Escape'&&battle&&!battle.paused)pauseBattle();else if(key==='Escape'&&battle?.paused)handleAction('resume');});window.addEventListener('keyup',e=>{const key=e.key.length===1?e.key.toLowerCase():e.key;keys[key]=false;});window.addEventListener('blur',()=>{keys={};touchKeys={};});
